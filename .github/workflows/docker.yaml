name: Docker

on:
  push:
    branches:
      - "main"
    paths:
      - ".dockerignore"
      - ".github/workflows/docker.yaml"
      - "Dockerfile"
      - "compose.yml"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/docker.yaml"
      - "Dockerfile"
      - "compose.yml"

jobs:
  build:
    name: Check Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check compose config
        run: docker compose config
      - name: Check compose docs profile config
        run: docker compose --profile docs config
      - name: Build app image
        run: docker build --target app .
